# --- Content blocks ---------------------------------------------------------
how_it_works:
  - step: 1
    title: "Book"
    description: "Tell us your date and pick a package. We confirm availability within 2 hours."
    icon: "calendar"
  - step: 2
    title: "We Set Up"
    description: "We arrive 30 minutes early. The booth is live and tested in 20 minutes."
    icon: "truck"
  - step: 3
    title: "Everyone Enjoys"
    description: "Guests shoot unlimited photos, walk away with prints, and get digital copies the same day."
    icon: "smile"

why_us:
  - title: "Professional DSLR Quality"
    description: "A real DSLR camera and studio lighting — not a webcam in a box. The difference is obvious in every print."
  - title: "Fast, Clean Setup"
    description: "The booth arrives pre-configured. Twenty minutes and we are live, with no disruption to your run sheet."
  - title: "Instant Results"
    description: "Prints in seconds and digital copies the same day. Nobody waits weeks for photos."
  - title: "Genuinely Self-Service"
    description: "An intuitive touchscreen means guests use it on their own. No queue-master required."
  - title: "Local Expertise"
    description: "We know Colombo venues, power quirks, monsoon season, and how Sri Lankan events actually run."
  - title: "Honest Pricing"
    description: "One quote with everything included. No surprise charges after the event."

values:
  - title: "Quality"
    description: "Professional equipment, properly maintained. No compromises on the thing your guests take home."
  - title: "Reliability"
    description: "We arrive early, every time. Your event runs to a schedule and so do we."
  - title: "Innovation"
    description: "We keep upgrading the tech so your event feels current, not like a booth from 2015."

# --- SEO --------------------------------------------------------------------
seo:
  title_template: "%s | PhotoPop — Photo Booth Rental Sri Lanka"
  default_description: "Premium automated photo booth rental in Colombo, Sri Lanka. Weddings, corporate events and parties. Instant prints and digital delivery."
  keywords: "photo booth rental Colombo, photo booth hire Sri Lanka, wedding photo booth, corporate event entertainment"
  author: "PhotoPop"

analytics:
  google_analytics_id: ""            # TODO (optional): "G-XXXXXXXXXX"

# Generated from brand/photopop-logo.png by `npm run brand` — do not edit by hand.
assets:
  logo: "/images/logo.webp"
  logo_png: "/images/logo.png"
  og_image: "/images/og-image.png"
