# ============================================================================
#  PhotoPop — Site Configuration
#  Edit this file to update the website. No code changes needed.
#  After editing: commit and push to develop; merge into main to publish.
#  This repository is PUBLIC — anything in this file is readable on GitHub.
# ============================================================================
#
#  Full walkthrough: docs/LAUNCH_GUIDE.md
#
#  BEFORE LAUNCH — replace every value marked TODO:
#    1. contact.phone / contact.whatsapp  -> real number, e.g. "+94771234567"
#    2. contact.email / bookings_email    -> addresses that actually receive mail
#    3. social.*                          -> confirm each account exists, or blank it
#    4. booking.google_form_id            -> see docs/GOOGLE_FORM_SETUP.md
#    5. analytics.google_analytics_id     -> GA4 measurement ID (optional)
#    6. launch.pre_launch                 -> set to false after first real events
#
#  Text values go in "double quotes". If a value contains a double quote,
#  write it as \" — or the build will stop with an error pointing at the line.
# ============================================================================

site:
  name: "PhotoPop"
  tagline: "Sri Lanka's Premier Photo Booth Experience"
  domain: "photopop.lk"
  url: "https://photopop.lk"
  description: "Automated, self-service photo booth rental for weddings, corporate events and celebrations in Colombo, Sri Lanka. Instant prints, digital delivery, professional DSLR quality."
  founded_year: 2026

contact:
  email: "hello@photopop.lk"         # TODO: must receive mail before launch
  bookings_email: "bookings@photopop.lk"  # TODO: same — or set to the hello@ address
  phone: "+94XXXXXXXXX"              # TODO: real number, country code, no spaces
  whatsapp: "+94XXXXXXXXX"           # TODO: usually the same number
  whatsapp_preset: "Hi PhotoPop, I'd like to book your photo booth for my event!"
  city: "Colombo"
  region: "Western Province"
  country: "LK"
  timezone: "Asia/Colombo"
  response_time: "within 2 hours"

# Handles only — no @ and no URL. Leave a value blank ("") to hide that
# platform everywhere on the site until the account exists.
social:
  instagram: "photopoplk"
  facebook: "PhotoPopLK"
  tiktok: "photopoplk"
  youtube: ""
  linkedin: ""

# --- Launch state -----------------------------------------------------------
# While pre_launch is true the site shows honest launch messaging instead of
# event counters, and testimonials/ratings stay hidden. Flip to false and fill
# in `metrics` + `testimonials` once you have real events and real reviews.
launch:
  pre_launch: true
  launch_label: "Launching 2026"
  founding_offer: "Founding-client rates for our first 10 bookings"
  founding_offer_detail: "Be one of our first events and lock in launch pricing — plus a free custom branded photo overlay."

# Only rendered when launch.pre_launch is false. Keep these truthful.
metrics:
  events_completed: 0
  happy_guests: 0
  photos_printed: 0
  reviews_5star: 0
  avg_rating: 0

# Only rendered when launch.pre_launch is false. Add real, consented quotes.
testimonials: []
# Example once you have a real one:
#   - name: "Ravi S."
#     role: "Groom"
#     event: "Wedding, Colombo"
#     quote: "The booth was the star of our wedding."
#     rating: 5
#     date: "2026-07-10"

# --- About page -------------------------------------------------------------
# The founders' section (names, roles, portraits). Shown only when show_team is
# true AND at least one member below has a name. Portraits go in
# src/assets/photos/team/ as member-1.jpg, member-2.jpg (see docs/LAUNCH_GUIDE.md).
#
# Leave the names blank until you're ready to be public: this repository is
# public, so anything typed here can be read on GitHub even while show_team
# is false — and stays in its history after you delete it.
about:
  show_team: false
  team:
    - name: ""
      role: ""
      bio: ""
      photo: "team/member-1"
    - name: ""
      role: ""
      bio: ""
      photo: "team/member-2"

# --- Booking ----------------------------------------------------------------
booking:
  # TODO: paste the ID from your Google Form's embed URL.
  # See docs/GOOGLE_FORM_SETUP.md. Until this is set, /book shows a
  # WhatsApp + email fallback panel instead of the embedded form.
  google_form_id: ""
  form_height_px: 1500
  promise: "No commitment. We reply within 2 hours."
  trust_signals:
    - "Professional DSLR quality"
    - "Instant prints & digital delivery"
    - "Same-day response"
    - "No hidden costs"

# --- Pricing ----------------------------------------------------------------
# The public site shows "from LKR X" only — never exact totals. This leaves
# room to negotiate and keeps the cost structure out of competitors' hands.
pricing:
  currency: "LKR"
  note: "All packages include setup, teardown and props. Travel outside Colombo is quoted separately."
  packages:
    - id: "silver"
      name: "Silver"
      price: 25000
      duration: "2 hours"
      tagline: "Perfect for intimate celebrations"
      target_audience: "Birthdays, small office parties, college events"
      featured: false
      features:
        - "Unlimited photo sessions"
        - "Digital photos via WhatsApp"
        - "Standard white or black backdrop"
        - "Full prop box included"
        - "Guest instruction card"
        - "Setup & teardown included"
    - id: "gold"
      name: "Gold"
      price: 40000
      duration: "3 hours"
      tagline: "Our most popular package"
      target_audience: "Weddings, SME product launches"
      featured: true
      features:
        - "Everything in Silver"
        - "Unlimited 4x6 prints on the spot"
        - "Premium backdrop options"
        - "Branded photo overlay"
        - "Optional live photo display screen"
        - "Online gallery link for all guests"
    - id: "platinum"
      name: "Platinum"
      price: 60000
      duration: "4 hours"
      tagline: "For events that need to impress"
      target_audience: "Premium weddings, large corporate events"
      featured: false
      features:
        - "Everything in Gold"
        - "Fully custom branded overlay"
        - "Premium + custom backdrop"
        - "Digital guest book"
        - "Dedicated booth attendant"
        - "Priority scheduling"
    - id: "diamond"
      name: "Diamond"
      price: 85000
      duration: "Full day (8 hours)"
      tagline: "The complete experience"
      target_audience: "Luxury and destination weddings, conferences"
      featured: false
      features:
        - "Everything in Platinum"
        - "Dual booth setup"
        - "Complete custom branding suite"
        - "Live social media display"
        - "Dedicated attendant + assistant"
        - "USB drive with all high-res photos"

